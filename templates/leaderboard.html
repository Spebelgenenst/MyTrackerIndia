<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTrackerIndia</title>
</head>
<body>
    {% for user in users %}
        <h3>
            <a href="/user/{{ user.name }}">{{ user.name }}</a>
            {% if sort == "total" %}
                Balance: {{ user.balance/100 }} inr
            {% endif %}

            {% if sort == "in_24h" %}
                Money made in 24 hours: {{ user.money_made_in_24_hours/100 }} inr
            {% endif %}
        </h3>
    {% endfor %}
    <a href="/sign_up">Sign Up</a> <a herf="/">Return Home</a>
</body>
</html>
